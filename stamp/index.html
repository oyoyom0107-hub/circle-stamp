<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サークルスタンプシステム</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        .loading { color: #f39c12; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>MatchPoint スタンプ</h2>
    <div id="status-message" class="status loading">スタンプを記録中...</div>
</div>

<!-- LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
// 💡 デプロイしたGASのURL
const apiUrl = "https://script.google.com/macros/s/AKfycbzFlaEaca6lVE4D2G5hNnacPrxM0u44GTuc-eVUtPuth5b4gp1q9XlBrrEd3kuTdrfh/exec"; 

// 💡 LINEログインで userId を取得する
async function initLiff() {
    try {
        await liff.init({
            liffId: "2011752461-qIktF1m8"  // ← 雄也の LIFF ID をセット済み
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return null;
        }

        const profile = await liff.getProfile();
        return profile.userId;

    } catch (err) {
        console.error("LIFF初期化エラー:", err);
        return null;
    }
}

// 💡 GAS にスタンプを送信する
async function sendStamp(userId, eventId) {
  const statusEl = document.getElementById("status-message");
  
  const payload = {
    userId: userId,
    eventId: eventId,
    timestamp: new Date().toISOString()
  };

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const resultText = await response.text();
    console.log("GASからの返答:", resultText);

    if (resultText.includes("OK")) {
        statusEl.textContent = "スタンプが記録されました！";
        statusEl.className = "status success";
    } else {
        statusEl.textContent = "エラーが発生しました: " + resultText;
        statusEl.className = "status error";
    }

  } catch (error) {
    console.error("送信エラー:", error);
    statusEl.textContent = "通信エラーが発生しました。";
    statusEl.className = "status error";
  }
}

// 💡 ページ読み込み時の処理
window.onload = async () => {
  const statusEl = document.getElementById("status-message");

  // URLパラメータから eventId を取得
  const urlParams = new URLSearchParams(window.location.search);
  const eventId = urlParams.get("event") || "test";

  // LINEログインして userId を取得
  const userId = await initLiff();

  if (!userId) {
    statusEl.textContent = "LINEログインが必要です。";
    statusEl.className = "status error";
    return;
  }

  // スタンプ送信
  sendStamp(userId, eventId);
};
</script>

</body>
</html>
