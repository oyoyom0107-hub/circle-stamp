<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Stamp Test</title>
</head>
<body>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbwo2DbJn-NVfCQK8Xyi_9OiBNyXkiXpN05yauSheOWxoImy7pD5t_x1DQnD0cmI3xk1/exec";

async function sendStamp(userId, eventId) {
  const payload = {
    userId: userId,
    eventId: eventId,
    timestamp: new Date().toISOString()
  };

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    console.log("送信完了（最新URLで送信）");
  } catch (error) {
    console.error("送信エラー:", error);
  }
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const eventId = urlParams.get("event") || "test";
  const userId = "test-user";
  sendStamp(userId, eventId);
};
</script>

</body>
</html>
