<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stamp</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h2>スタンプ処理中...</h2>

  <script>
    const liffId = "2011752461-qIktF1m8";  
   const apiUrl = "https://script.google.com/macros/s/AKfycbzcapeNlgXOs4jXi2WjV-ZFEASzy0qcxrZa2k0Czwt6b0Jj6vGH1Sf26pysuu1jmK4/exec";

    async function main() {
      await liff.init({ liffId });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("event") || "default";

     await fetch(apiUrl, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    userId,
    eventId,
    timestamp: new Date().toISOString()
  })
});


      document.body.innerHTML = `
        <h2>スタンプを記録しました！</h2>
        <p>ユーザーID: ${userId}</p>
        <p>イベント: ${eventId}</p>
      `;
    }

    main();
  </script>
</body>
</html>
