<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタンプ取得 | MatchPoint</title><style>
:root{font-family:system-ui,sans-serif;color:#17324c}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#eaf5ff,#e6faf5);display:grid;place-items:center}.card{background:#fff;border-radius:20px;padding:30px 22px;max-width:430px;width:calc(100% - 48px);box-shadow:0 12px 32px #17324c18;text-align:center}h1{font-size:24px}.icon{font-size:56px}.status{line-height:1.7}a{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#168b77;color:#fff;text-decoration:none}
</style></head><body><main class="card"><h1>MatchPoint スタンプ</h1><div class="icon" id="icon">⏳</div><p class="status" id="status">確認中...</p><a href="../mypage.html" id="mypage" hidden>マイページへ</a></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbzM4AtVBnwg01DW2djm8dmk1v348y3TYl8FP8R1nYnIhFIVgMPyOBnuWTECIVc00N61/exec';
const LIFF_ID='2011752461-qIktF1m8';
function show(message,icon='⚠️'){document.getElementById('status').textContent=message;document.getElementById('icon').textContent=icon}
(async()=>{try{const qs=new URLSearchParams(location.search);const eventId=qs.get('event');const code=qs.get('code');if(!eventId||!code)throw Error('有効なイベントQRを読み取ってください。');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}const accessToken=liff.getAccessToken();if(!accessToken)throw Error('LINE認証が必要です。LINEから開き直してください。');const response=await fetch(API,{method:'POST',body:JSON.stringify({type:'stamp',accessToken,eventId,code})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.message||'記録できませんでした。');show(data.stampMode==='on'?'スタンプを1個記録しました！':'参加を記録しました（スタンプなし）。','✅');document.getElementById('mypage').hidden=false}catch(err){show(err.message||'通信エラーが発生しました。')}})();
</script></body></html>
