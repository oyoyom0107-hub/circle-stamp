<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchPoint スタンプ記録</title>

  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #4a90e2, #50c9c3);
      margin: 0;
      padding: 0;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 380px;
      width: 90%;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .loading { color: #f39c12; }
    .success { color: #2ecc71; }
    .info { color: #3498db; }
    .error { color: #e74c3c; }

    .mypage-btn {
      margin-top: 20px;
      padding: 12px 20px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      display: none;
    }

    .mypage-btn:hover {
      background: #357ABD;
    }
  </style>
</head>
<body>

<div class="card">
  <div id="icon" class="icon">⏳</div>
  <div class="title">MatchPoint スタンプ</div>
  <div id="status-message" class="status loading">スタンプを記録中...</div>

  <button id="mypage-btn" class="mypage-btn" onclick="goToMyPage()">
    マイページへ
  </button>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbxlMfcvfDPOmsZew6W63YdvzD7kxxcs_b9L5aqJxd3TNw8Xy1-5jvKA4iZlzsdNvxaE/exec";

async function initLiff() {
  await liff.init({ liffId: "2011752461-qIktF1m8" });

  if (!liff.isLoggedIn()) {
    liff.login();
    return null;
  }

  const profile = await liff.getProfile();
  return profile;
}

async function sendStamp(profile, eventId, eventName, stampMode) {
  const statusEl = document.getElementById("status-message");
  const iconEl = document.getElementById("icon");
  const mypageBtn = document.getElementById("mypage-btn");

  const payload = {
    userId: profile.userId,
    userName: profile.displayName,
    eventId: eventId,
    eventName: eventName,
    timestamp: new Date().toISOString(),
    stampMode: stampMode   // ← 追加
  };

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const resultText = await response.text();

    if (resultText.includes("OK")) {

      if (stampMode === "on") {
        iconEl.textContent = "✔️";
        statusEl.textContent = "スタンプが記録されました！";
        statusEl.className = "status success";
      } else {
        iconEl.textContent = "ℹ️";
        statusEl.textContent = "参加を記録しました（スタンプなし）";
        statusEl.className = "status info";
      }

      mypageBtn.style.display = "block";

    } else {
      iconEl.textContent = "⚠️";
      statusEl.textContent = "エラーが発生しました: " + resultText;
      statusEl.className = "status error";
    }

  } catch (error) {
    iconEl.textContent = "❌";
    statusEl.textContent = "通信エラーが発生しました。";
    statusEl.className = "status error";
  }
}

function goToMyPage() {
  window.location.href = "https://oyoyom0107-hub.github.io/circle-stamp/mypage.html";
}

window.onload = async () => {
  const urlParams = new URLSearchParams(window.location.search);

  const eventId = urlParams.get("event") || "unknown";
  const eventName = urlParams.get("name") || "イベント名なし";
  const stampMode = urlParams.get("stampMode") || "on";  // ← 追加

  const profile = await initLiff();
  if (!profile) return;

  sendStamp(profile, eventId, eventName, stampMode);
};
</script>

</body>
</html>
