<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatchPoint</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17324c}body{margin:0;min-height:100vh;background:#edf5f8;display:grid;place-items:center}.card{background:#fff;border-radius:18px;max-width:440px;width:calc(100% - 40px);padding:28px;box-shadow:0 8px 24px #17324c18;text-align:center}a{display:block;padding:14px;margin-top:12px;border-radius:10px;background:#167b88;color:#fff;text-decoration:none}a:last-child{background:#147e70}p{line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <h1>MatchPoint</h1>
    <p id="status">ページを開いています…</p>
    <nav><a href="mypage.html">マイページ</a><a href="admin.html">管理者ページ</a></nav>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      const isLiffRedirect=new URLSearchParams(location.search).has('liff.state');
      try{
        // LIFF URL の初回遷移では SDK に liff.state を処理させ、元のページへ戻す。
        await liff.init({liffId:'2011752461-qIktF1m8'});
        if(isLiffRedirect){
          status.textContent='移動しない場合は、下のリンクからページを開いてください。';
          return;
        }
        if(!liff.isLoggedIn()){
          liff.login({redirectUri:new URL('mypage.html',location.href).href});
          return;
        }
        location.replace(new URL('mypage.html',location.href).href);
      }catch(e){status.textContent='自動で開けませんでした。下のリンクからページを選んでください。'}
    })();
  </script>
</body>
</html>
