<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタンプ取得 | Match Point</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17324c}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#eaf5ff,#e6faf5);display:grid;place-items:center}.card{background:#fff;border-radius:20px;padding:30px 22px;max-width:430px;width:calc(100% - 48px);box-shadow:0 12px 32px #17324c18;text-align:center}h1{font-size:24px}.icon{font-size:56px}.status{font-size:21px;font-weight:700;line-height:1.6}.detail{line-height:1.7}.detail:empty{display:none}a{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#168b77;color:#fff;text-decoration:none}
</style></head><body><main class="card"><h1>Match Point スタンプ</h1><div class="icon" id="icon">⏳</div><p class="status" id="status">確認中...</p><p class="detail" id="detail"></p><a href="../mypage.html" id="mypage" hidden>マイページで確認</a></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbxTYedx5VBpe5BPyIsQx0iNwS_3xZ3EaWfQDDyOGSQhP3TK6J0F-VWRfYvTjaOATawn/exec';
const LIFF_ID='2011752461-qIktF1m8';
async function reliableRequest(type,fields={}){
 const financial=['stamp','manualCheckin','collectionPaymentConfirm','collectionPaymentCancel'].includes(type);
 const payload={...fields};if(financial&&!payload.requestId)payload.requestId=globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);
 async function once(kind,body){const accessToken=liff.getAccessToken();if(!accessToken)throw Error('LINE認証が必要です。LINEから開き直してください。');const control=new AbortController(),timer=setTimeout(()=>control.abort(),18000);try{const r=await fetch(API,{method:'POST',body:JSON.stringify({type:kind,accessToken,...body}),signal:control.signal});if(!r.ok)throw Error('通信に失敗しました。');return await r.json();}catch(e){e.transport=true;throw e;}finally{clearTimeout(timer);}}
 for(let attempt=0;attempt<4;attempt++){
  try{const result=await once(type,payload);if(!result.retryable&&result.code!=='BUSY')return result;}
  catch(error){if(!error.transport)throw error;if(financial){let s;try{s=await once(type==='stamp'?'receptionStatus':'collectionPaymentStatus',{eventId:payload.eventId,userId:payload.userId});}catch(e){throw Error('受付結果を確認できません。通信を確認し、表示を更新してから記録をご確認ください。');}if(!s.ok)throw Error(s.message||'受付結果を確認できません。');if(type==='collectionPaymentCancel'&&s.status==='none')return {...s,ok:true,recovered:true,canceled:true};if(type!=='collectionPaymentCancel'&&((type==='stamp'&&['pending','recorded','paid'].includes(s.status))||s.status==='paid'))return {...s,ok:true,recovered:true,alreadyConfirmed:s.status==='paid',paymentPending:s.status==='pending'};}else if(!['adminHome','adminSection','adminHistory','mypageFast','memberHistory','calendarHolidays','collectionPaymentPreview'].includes(type))throw error;}
  if(attempt===3)throw Error('現在受付が混み合っています。少し待って表示を更新し、記録を確認してからお試しください。');
  await new Promise(resolve=>setTimeout(resolve,300*2**attempt+Math.floor(Math.random()*300)));
 }
}

function show(message,detail='',icon='⚠️'){
  document.getElementById('status').textContent=message;
  document.getElementById('detail').textContent=detail;
  document.getElementById('icon').textContent=icon;
}
(async()=>{
  try{
    const qs=new URLSearchParams(location.search);
    const eventId=qs.get('event'),code=qs.get('code');
    if(!eventId||!code)throw Error('有効なイベントQRを読み取ってください。');
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){
      const redirectUrl=new URL(location.href);
      redirectUrl.search=new URLSearchParams({event:eventId,code}).toString();
      redirectUrl.hash='';
      liff.login({redirectUri:redirectUrl.href});
      return;
    }
    const accessToken=liff.getAccessToken();
    if(!accessToken)throw Error('LINE認証が必要です。LINEから開き直してください。');
    const data=await reliableRequest('stamp',{eventId,code});
    document.getElementById('mypage').hidden=false;
    if(!data.ok){
      if(data.code==='ALREADY_RECORDED')show('このイベントは記録済みです','同じ活動のスタンプは1回だけ取得できます。','ℹ️');
      else if(data.code==='PAUSED')show('このイベントは受付停止中です','スタッフにご確認ください。','⏸️');
      else if(data.code==='EXPIRED')show('QRコードの期限が切れています','スタッフに新しいQRコードをご確認ください。','⌛');
      else show('スタンプを記録できませんでした',data.message||'スタッフにご確認ください。');
      return;
    }
    if(data.paymentPending){show('入金確認待ちです',`${data.eventName} ／ ${Number(data.amount).toLocaleString('ja-JP')}円。管理者にこの画面を見せ、入金の確認を受けてください。まだ集金済みではありません。`,'⌛');return;}
    if(data.recovered){show('受付済みを確認しました',data.eventName+' ／ 追加の記録は作成していません。','✅');return;}
    if(data.stampMode==='on'){
      show('スタンプを1個取得しました！',`${data.eventName} ／ 現在 ${data.stampCount}個${data.availableBonus>0?` ／ 利用可能な特典 ${data.availableBonus}個`:''}`,'✅');
    }else{
      show('参加を記録しました',`${data.eventName} ／ 今回はスタンプの付与なし`,'✅');
    }
  }catch(error){show('確認できませんでした',error.message||'通信状況を確認して再度お試しください。')}
})();
</script></body></html>
