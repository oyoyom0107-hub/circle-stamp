<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ページ | MatchPoint</title>

  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f1f2f6;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    .section-title {
      font-size: 22px;
      margin-top: 40px;
      margin-bottom: 10px;
      color: #2d3436;
      font-weight: bold;
    }

    .event-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .event-card h3 {
      margin: 0 0 10px;
      color: #0984e3;
    }

    .user-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    .info {
      font-size: 15px;
      margin: 4px 0;
    }

    .csv-btn {
      margin-top: 10px;
      padding: 10px 15px;
      background: #0984e3;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      display: inline-block;
    }
  </style>
</head>
<body>

<h2>MatchPoint 管理者ページ</h2>

<div id="admin-check"></div>

<div class="section-title">イベント別参加者一覧</div>
<div id="events"></div>

<div class="section-title">全ユーザーのスタンプ履歴 CSV</div>
<div class="csv-btn" onclick="downloadAllCSV()">全ユーザーのスタンプ履歴をダウンロード</div>

<div class="section-title">特典獲得者一覧 CSV</div>
<div class="csv-btn" onclick="downloadBonusCSV()">特典獲得者一覧をダウンロード</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbxvrsDCZizsxMKFWt2Gd_nMBiNFgK5Tui3z-E1KN11Ic0QvDpOOEV-WHn8H0g58VfCM/exec";

// ▼ 管理者の LINE userId を登録（複数可）
const ADMIN_USERS = [
  "ここに雄也のLINEユーザーIDを入れる"
];

let allData = []; // 全データ保持

/* ▼ 管理者チェック */
async function checkAdmin() {
  await liff.init({ liffId: "2011752461-qIktF1m8" });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const profile = await liff.getProfile();
  const userId = profile.userId;

  if (!ADMIN_USERS.includes(userId)) {
    document.body.innerHTML = `
      <div style="padding:40px; text-align:center; font-size:20px;">
        🚫 <strong>アクセス権がありません</strong><br><br>
        このページは管理者専用です。
      </div>
    `;
    return;
  }

  // ▼ 管理者ならデータ読み込み
  loadAllData();
}

/* ▼ 全データ読み込み */
async function loadAllData() {
  const response = await fetch(apiUrl + "?all=true");
  allData = await response.json();

  // ▼ イベントごとにグループ化
  const events = {};

  allData.forEach(r => {
    if (!events[r.eventId]) {
      events[r.eventId] = {
        eventName: r.eventName,
        participants: []
      };
    }
    events[r.eventId].participants.push(r);
  });

  const eventsEl = document.getElementById("events");

  Object.keys(events).forEach(eventId => {
    const ev = events[eventId];

    const card = document.createElement("div");
    card.className = "event-card";

    card.innerHTML = `
      <h3>${ev.eventName}（ID: ${eventId}）</h3>
      <div class="info">参加人数：<strong>${ev.participants.length}</strong></div>
    `;

    ev.participants.forEach(p => {
      const item = document.createElement("div");
      item.className = "user-item";
      item.innerHTML = `
        👤 ${p.userName}（${p.userId}）<br>
        ⏰ ${new Date(p.timestamp).toLocaleString()}
      `;
      card.appendChild(item);
    });

    // ▼ CSV ダウンロードボタン（イベント別）
    const csvBtn = document.createElement("div");
    csvBtn.className = "csv-btn";
    csvBtn.textContent = "このイベントの参加者を CSV ダウンロード";
    csvBtn.onclick = () => downloadEventCSV(eventId, ev);
    card.appendChild(csvBtn);

    eventsEl.appendChild(card);
  });
}

/* ▼ CSV生成 */
function toCSV(rows) {
  return rows.map(r => r.join(",")).join("\n");
}

/* ▼ ダウンロード */
function downloadFile(filename, content) {
  const blob = new Blob([content], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* ▼ ① イベント別 CSV */
function downloadEventCSV(eventId, ev) {
  const rows = [["userId","userName","eventId","eventName","timestamp"]];

  ev.participants.forEach(p => {
    rows.push([p.userId, p.userName, p.eventId, p.eventName, p.timestamp]);
  });

  downloadFile(`${eventId}_participants.csv`, toCSV(rows));
}

/* ▼ ② 全ユーザーのスタンプ履歴 CSV */
function downloadAllCSV() {
  const rows = [["userId","userName","eventId","eventName","timestamp"]];

  allData.forEach(p => {
    rows.push([p.userId, p.userName, p.eventId, p.eventName, p.timestamp]);
  });

  downloadFile(`all_stamp_records.csv`, toCSV(rows));
}

/* ▼ ③ 特典獲得者一覧 CSV（5の倍数） */
function downloadBonusCSV() {
  const rows = [["userId","userName","stampCount","bonusCount"]];

  const users = {};

  allData.forEach(r => {
    if (!users[r.userId]) users[r.userId] = [];
    users[r.userId].push(r);
  });

  Object.keys(users).forEach(uid => {
    const count = users[uid].length;
    const bonus = Math.floor(count / 5);

    if (bonus > 0) {
      rows.push([
        uid,
        users[uid][0].userName,
        count,
        bonus
      ]);
    }
  });

  downloadFile(`bonus_users.csv`, toCSV(rows));
}

/* ▼ 管理者チェック開始 */
checkAdmin();
</script>

</body>
</html>
