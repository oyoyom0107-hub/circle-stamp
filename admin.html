<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ページ | MatchPoint</title>

  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f1f2f6;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    .section-title {
      font-size: 22px;
      margin-top: 40px;
      margin-bottom: 10px;
      color: #2d3436;
      font-weight: bold;
    }

    .event-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .event-card h3 {
      margin: 0 0 10px;
      color: #0984e3;
    }

    .user-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    .info {
      font-size: 15px;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<h2>MatchPoint 管理者ページ</h2>

<div class="section-title">イベント別参加者一覧</div>
<div id="events"></div>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbxvrsDCZizsxMKFWt2Gd_nMBiNFgK5Tui3z-E1KN11Ic0QvDpOOEV-WHn8H0g58VfCM/exec";

async function loadAllData() {
  const response = await fetch(apiUrl + "?all=true");
  const data = await response.json();

  // ▼ イベントごとにグループ化
  const events = {};

  data.forEach(r => {
    if (!events[r.eventId]) {
      events[r.eventId] = {
        eventName: r.eventName,
        participants: []
      };
    }
    events[r.eventId].participants.push(r);
  });

  const eventsEl = document.getElementById("events");

  Object.keys(events).forEach(eventId => {
    const ev = events[eventId];

    const card = document.createElement("div");
    card.className = "event-card";

    card.innerHTML = `
      <h3>${ev.eventName}（ID: ${eventId}）</h3>
      <div class="info">参加人数：<strong>${ev.participants.length}</strong></div>
    `;

    ev.participants.forEach(p => {
      const item = document.createElement("div");
      item.className = "user-item";
      item.innerHTML = `
        👤 ${p.userName}（${p.userId}）<br>
        ⏰ ${new Date(p.timestamp).toLocaleString()}
      `;
      card.appendChild(item);
    });

    eventsEl.appendChild(card);
  });
}

loadAllData();
</script>

</body>
</html>
