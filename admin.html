<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理画面 | MatchPoint</title><style>
:root{font-family:system-ui,sans-serif;color:#17324c}*{box-sizing:border-box}body{margin:0;background:#edf5f8}header{background:#167b88;color:white;padding:20px;text-align:center}main{max-width:900px;margin:20px auto;padding:0 14px}.box{background:#fff;border-radius:15px;margin:14px 0;padding:20px;box-shadow:0 3px 15px #17324c12}h2{font-size:20px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#e9f6f4;padding:14px;border-radius:10px}.stat strong{font-size:25px}input,select,button{font:inherit;padding:10px;border:1px solid #b4c8cf;border-radius:8px}input,select{width:100%;margin:6px 0 12px}button{background:#147e70;color:#fff;border:0;cursor:pointer;margin:5px 4px 5px 0}button.danger{background:#b23c45}button:disabled{opacity:.5}.item{border-top:1px solid #dce7eb;padding:12px 0}.muted{color:#577080;font-size:14px}#status{min-height:24px}#qr img{max-width:100%}a{overflow-wrap:anywhere}nav a{display:inline-block;margin:5px;color:#167b88}
</style></head><body><header><h1>MatchPoint 管理画面</h1></header><main><p id="status">確認中...</p><div id="panel" hidden><nav><a href="#events">イベント管理</a><a href="#users">参加者・特典</a><a href="#history">履歴</a></nav><section class="box"><h2>ダッシュボード</h2><div class="stats" id="stats"></div></section><section class="box" id="events"><h2>イベント管理</h2><label>イベントID<input id="eventId" placeholder="例：20260928-badminton"></label><label>イベント名<input id="eventName" placeholder="例：バドミントン"></label><label>スタンプ<select id="stampMode"><option value="on">付与する</option><option value="off">参加記録のみ</option></select></label><label>QR有効期限（日本時間）<input type="datetime-local" id="expiresAt"></label><button id="saveEvent">作成・更新してQRを発行</button><p class="muted">更新すると以前のQRは無効になります。有効期限後の読み取りは記録されません。</p><div id="qr"></div><div id="eventList"></div></section><section class="box" id="users"><h2>参加者・特典管理</h2><input id="search" placeholder="名前・ユーザーIDを検索"><div id="userList"></div></section><section class="box" id="history"><h2>参加履歴</h2><button id="csvRecords">履歴CSV</button><button id="csvBonus">特典CSV</button><div id="recordList"></div></section></div></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbzM4AtVBnwg01DW2djm8dmk1v348y3TYl8FP8R1nYnIhFIVgMPyOBnuWTECIVc00N61/exec';const LIFF_ID='2011752461-qIktF1m8';const STAMP_URL=new URL('stamp/index.html',location.href).href;let state={events:[],records:[],redemptions:[],users:[],stats:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=s=>document.getElementById('status').textContent=s;
async function api(type,fields={}){const token=liff.getAccessToken();if(!token)throw Error('LINE認証が必要です。');const response=await fetch(API,{method:'POST',body:JSON.stringify({type,accessToken:token,...fields})});const data=await response.json();if(!data.ok)throw Error(data.message||'処理に失敗しました。');return data}
async function refresh(){const d=await api('adminData');state=d;render();status('読み込み完了')}
function render(){document.getElementById('stats').innerHTML=[['今日の参加者',state.stats.today],['総登録者',state.stats.registered],['今月の参加者',state.stats.month],['未使用特典',state.stats.available]].map(([n,v])=>`<div class="stat">${n}<br><strong>${v}</strong></div>`).join('');document.getElementById('eventList').innerHTML=state.events.map((e,i)=>`<div class="item"><strong>${esc(e.eventName)}</strong> <span class="muted">${esc(e.eventId)} ／ ${e.stampMode==='on'?'スタンプ':'記録のみ'} ／ 期限 ${esc(e.expiresAt)}</span><br><button data-edit="${i}">編集</button><button data-qr="${i}">QR表示</button><button class="danger" data-delete="${i}">削除</button></div>`).join('');renderUsers();document.getElementById('recordList').innerHTML=state.records.slice().reverse().slice(0,100).map(r=>`<div class="item">${esc(r.userName)} ／ ${esc(r.eventName)} ／ ${r.stampMode==='on'?'+1':'記録のみ'}<br><span class="muted">${esc(formatDate(r.timestamp))}</span></div>`).join('')||'履歴なし'}
function renderUsers(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('userList').innerHTML=state.users.filter(u=>(u.userName+' '+u.userId).toLowerCase().includes(q)).map(u=>`<div class="item"><strong>${esc(u.userName)}</strong> <span class="muted">${esc(u.userId)}</span><br>スタンプ ${u.stampCount} ／ 獲得 ${u.earnedBonus} ／ 使用済み ${u.redeemedBonus} ／ 利用可能 ${u.availableBonus}<br><button data-redeem="${esc(u.userId)}" ${u.availableBonus<1?'disabled':''}>特典を1個使用済みにする</button><details><summary>参加履歴</summary>${state.records.filter(r=>r.userId===u.userId).slice().reverse().map(r=>`<div class="muted">${esc(formatDate(r.timestamp))} ${esc(r.eventName)} ${r.stampMode==='on'?'+1':'記録のみ'}</div>`).join('')}</details></div>`).join('')||'該当者なし'}
function formatDate(v){const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}
function showQR(e){if(!e.code){status('QRコードがありません。');return}const url=new URL(STAMP_URL);url.searchParams.set('event',e.eventId);url.searchParams.set('code',e.code);const box=document.getElementById('qr');box.replaceChildren();const p=document.createElement('p');p.textContent=`${e.eventName} ／ 有効期限 ${e.expiresAt}`;const a=document.createElement('a');a.href=url.href;a.textContent=url.href;const holder=document.createElement('div');holder.style.marginTop='12px';box.append(p,a,holder);if(window.QRCode)new QRCode(holder,{text:url.href,width:260,height:260});else status('QRライブラリを読み込めませんでした。URLを使ってください。');box.scrollIntoView({behavior:'smooth'})}
function download(name,rows){const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('saveEvent').onclick=async()=>{try{const eventId=document.getElementById('eventId').value.trim(),eventName=document.getElementById('eventName').value.trim(),stampMode=document.getElementById('stampMode').value,raw=document.getElementById('expiresAt').value;if(!eventId||!eventName||!raw)throw Error('イベントID・名前・有効期限を入力してください。');const expiresAt=new Date(raw).toISOString();await api('eventUpdate',{eventId,eventName,stampMode,expiresAt});await refresh();showQR(state.events.find(e=>e.eventId===eventId));status('保存しました。新しいQRをご利用ください。')}catch(e){status(e.message)}};
document.getElementById('eventList').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const i=b.dataset.edit??b.dataset.qr??b.dataset.delete;const e=state.events[Number(i)];if(!e)return;if(b.dataset.edit!==undefined){document.getElementById('eventId').value=e.eventId;document.getElementById('eventName').value=e.eventName;document.getElementById('stampMode').value=e.stampMode;document.getElementById('expiresAt').value=new Date(e.expiresAt).toLocaleString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,16);document.getElementById('eventId').focus()}else if(b.dataset.qr!==undefined)showQR(e);else if(confirm(`${e.eventName} を削除しますか？`)){try{await api('eventDelete',{eventId:e.eventId});await refresh()}catch(err){status(err.message)}}};
document.getElementById('userList').onclick=async ev=>{const uid=ev.target.closest('button')?.dataset.redeem;if(!uid||!confirm('特典を1個使用済みにしますか？'))return;try{await api('redeem',{userId:uid});await refresh();status('特典を使用済みにしました。')}catch(e){status(e.message)}};document.getElementById('search').oninput=renderUsers;
document.getElementById('csvRecords').onclick=()=>download('stamp_records.csv',[['userId','userName','eventId','eventName','timestamp','stampMode'],...state.records.map(r=>[r.userId,r.userName,r.eventId,r.eventName,r.timestamp,r.stampMode])]);document.getElementById('csvBonus').onclick=()=>download('bonus_users.csv',[['userId','userName','stampCount','earnedBonus','redeemedBonus','availableBonus'],...state.users.map(u=>[u.userId,u.userName,u.stampCount,u.earnedBonus,u.redeemedBonus,u.availableBonus])]);
(async()=>{try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}await refresh();document.getElementById('panel').hidden=false}catch(e){status(e.message||'管理者として認証できませんでした。')}})();
</script></body></html>
