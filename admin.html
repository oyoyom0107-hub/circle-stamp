<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理画面 | MatchPoint</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17324c}*{box-sizing:border-box}body{margin:0;background:#edf5f8}header{background:#167b88;color:#fff;padding:20px;text-align:center}main{max-width:920px;margin:20px auto;padding:0 14px}.box{background:#fff;border-radius:15px;margin:14px 0;padding:20px;box-shadow:0 3px 15px #17324c12}h2{font-size:20px}h3{font-size:17px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#e9f6f4;padding:14px;border-radius:10px}.stat strong{font-size:25px}input,select,button{font:inherit;padding:10px;border:1px solid #b4c8cf;border-radius:8px}input,select{width:100%;margin:6px 0 12px}button{background:#147e70;color:#fff;border:0;cursor:pointer;margin:5px 4px 5px 0}button.danger{background:#b23c45}button:disabled{opacity:.5}.item{border-top:1px solid #dce7eb;padding:12px 0;overflow-wrap:anywhere}.muted{color:#577080;font-size:14px}.error{color:#ae2b38}#status{min-height:24px;position:sticky;top:0;background:#edf5f8;padding:9px 4px;z-index:2}#qr img{max-width:100%}a{overflow-wrap:anywhere}nav a{display:inline-block;margin:5px;color:#167b88}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#e9f6f4}.paused,.revoked{color:#ae2b38}.small{font-size:13px}.help{line-height:1.6}dialog{border:0;border-radius:14px;padding:22px;max-width:440px;width:calc(100% - 28px);box-shadow:0 12px 40px #1235}dialog::backdrop{background:#16263899}@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>MatchPoint 管理画面</h1></header><main><p id="status" role="status">確認中...</p><div id="panel" hidden>
<nav><a href="#events">イベント</a><a href="#users">参加者・特典</a><a href="#history">履歴</a><a href="#eventStats">集計</a><a href="#admins" id="adminsLink">管理者</a></nav>
<section class="box"><h2>ダッシュボード</h2><div class="stats" id="stats"></div></section>
<section class="box" id="events"><h2>イベント管理</h2>
<h3>活動の種類を登録</h3>
<div class="grid"><label>活動名<input id="activityName" placeholder="例：バドミントン"></label><label>ローマ字コード（英小文字）<input id="activityCode" placeholder="例：badminton" maxlength="32" pattern="[a-z]{2,32}"></label></div>
<button id="addActivity">活動の種類を登録</button><div id="activityList"></div>
<h3>本日のイベントを作成</h3>
<label>活動の種類<select id="activityType"><option value="">選択してください</option></select></label>
<p id="eventPreview" class="muted"></p>
<label>スタンプ<select id="stampMode"><option value="on">付与する</option><option value="off">参加記録のみ</option></select></label>
<label>QR有効期限（日本時間）<input type="datetime-local" id="expiresAt"></label>
<button id="createEvent">本日のイベントを作成してQRを発行</button>
<p class="muted help">同じ活動は1日に1回作成できます。IDの日付は作成日の日本時間です。</p>
<div id="editPanel" hidden><h3>イベントを編集</h3><p id="editEventLabel"></p>
<label>スタンプ<select id="editStampMode"><option value="on">付与する</option><option value="off">参加記録のみ</option></select></label>
<label>QR有効期限（日本時間）<input type="datetime-local" id="editExpiresAt"></label>
<button id="updateEvent">変更してQRを再発行</button>
<p class="muted help">更新後もイベントIDとイベント名は変わりません。QRは再発行され、以前のQRは無効になります。受付停止中なら停止は継続します。</p></div>
<div id="qr"></div><div id="eventList"></div></section>
<section class="box" id="users"><h2>参加者・特典管理</h2><input id="userSearch" placeholder="名前・ユーザーIDを検索"><div id="userList"></div></section>
<section class="box" id="history"><h2>参加履歴・訂正履歴</h2>
<div class="grid"><label>イベント<select id="filterEvent"><option value="">すべて</option></select></label><label>種別<select id="filterMode"><option value="">すべて</option><option value="on">スタンプ付与</option><option value="off">参加のみ</option><option value="revoked">訂正済み</option></select></label><label>開始日<input type="date" id="dateFrom"></label><label>終了日<input type="date" id="dateTo"></label></div>
<input id="historySearch" placeholder="参加者名・ユーザーID・イベント名で検索">
<button id="csvRecords">表示中の履歴CSV</button><button id="csvBonus">特典CSV</button>
<p id="recordCount" class="muted"></p><div id="recordList"></div>
<h3>スタンプ訂正の操作履歴</h3><div id="correctionList"></div></section>
<section class="box" id="eventStats"><h2>イベント集計</h2><div id="eventStatsList"></div></section>
<section class="box" id="admins"><h2>管理者の引き継ぎ</h2><p class="muted help">参加履歴のある人から追加できます。本人が自身のLINEで管理画面を開けるようになります。</p>
<label>新しい管理者<select id="newAdmin"><option value="">選択してください</option></select></label><button id="addAdmin">管理者に追加</button>
<div id="adminList"></div><h3>変更履歴</h3><div id="adminAuditList"></div></section>
</div></main>
<dialog id="confirmDialog"><h2 id="dialogTitle"></h2><p id="dialogDetails" class="help"></p><div id="dialogReasonWrap" hidden><label>訂正理由（3〜200文字）<input id="dialogReason" maxlength="200" placeholder="例：誤って付与したため"></label></div><button id="dialogCancel" type="button">戻る</button><button id="dialogConfirm" type="button">確定する</button></dialog>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbxTYedx5VBpe5BPyIsQx0iNwS_3xZ3EaWfQDDyOGSQhP3TK6J0F-VWRfYvTjaOATawn/exec';
const LIFF_ID='2011752461-qIktF1m8',STAMP_URL=new URL('stamp/index.html',location.href).href;
let editEventId=null;
let state={activityTypes:[],events:[],records:[],redemptions:[],users:[],corrections:[],eventStats:[],adminUsers:[],adminAudit:[],stats:{}};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=(s,error=false)=>{el('status').textContent=s;el('status').className=error?'error':''};
const date=v=>{const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})};
const day=v=>new Date(v).toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
async function api(type,fields={}){const accessToken=liff.getAccessToken();if(!accessToken)throw Error('LINE認証が必要です。');const response=await fetch(API,{method:'POST',body:JSON.stringify({type,accessToken,...fields})});const data=await response.json();if(!data.ok)throw Error(data.message||'処理に失敗しました。');return data}
async function refresh(){state=await api('adminData');render();status('読み込み完了')}
async function run(type,fields,message){try{await api(type,fields);await refresh();status(message||'保存しました。')}catch(e){status(e.message,true)}}
function render(){
 renderActivities();
 el('stats').innerHTML=[['今日の参加者',state.stats.today],['総登録者',state.stats.registered],['今月の参加者',state.stats.month],['未使用特典',state.stats.available]].map(([n,v])=>`<div class="stat">${n}<br><strong>${v}</strong></div>`).join('');
 el('eventList').innerHTML=state.events.map((ev,i)=>{const paused=ev.status==='paused',expired=new Date(ev.expiresAt).getTime()<=Date.now();return `<div class="item"><strong>${esc(ev.eventName)}</strong> <span class="pill ${paused?'paused':''}">${paused?'受付停止':expired?'期限切れ':'受付中'}</span><br><span class="muted">${esc(ev.eventId)} ／ ${ev.stampMode==='on'?'スタンプ':'記録のみ'} ／ 期限 ${esc(date(ev.expiresAt))}</span><br><button data-edit="${i}">編集</button><button data-qr="${i}">QR表示</button><button data-toggle="${i}" ${expired&&!paused?'disabled':''}>${paused?'受付再開':'受付停止'}</button><button class="danger" data-delete="${i}">削除</button></div>`}).join('')||'イベントなし';
 renderUsers();renderFilters();renderHistory();renderStats();renderAdmins();
}
function renderUsers(){const q=el('userSearch').value.toLowerCase();el('userList').innerHTML=state.users.filter(u=>(u.userName+' '+u.userId).toLowerCase().includes(q)).map(u=>`<div class="item"><strong>${esc(u.userName)}</strong> <span class="muted small">${esc(u.userId)}</span><br>スタンプ ${u.stampCount} ／ 獲得 ${u.earnedBonus} ／ 使用済み ${u.redeemedBonus} ／ 利用可能 <strong>${u.availableBonus}</strong><br><button data-redeem="${esc(u.userId)}" ${u.availableBonus<1?'disabled':''}>特典を1個使用済みにする</button></div>`).join('')||'該当者なし'}
function renderFilters(){const selected=el('filterEvent').value;const ids=[...new Set(state.records.map(r=>String(r.eventId)))];el('filterEvent').innerHTML='<option value="">すべて</option>'+ids.map(id=>`<option value="${esc(id)}">${esc(state.events.find(e=>String(e.eventId)===id)?.eventName||state.records.find(r=>String(r.eventId)===id)?.eventName||id)}（${esc(id)}）</option>`).join('');el('filterEvent').value=selected}
function filteredRecords(){const q=el('historySearch').value.toLowerCase(),event=el('filterEvent').value,mode=el('filterMode').value,from=el('dateFrom').value,to=el('dateTo').value;return state.records.filter(r=>{const d=day(r.timestamp);return (!q||(r.userName+' '+r.userId+' '+r.eventName).toLowerCase().includes(q))&&(!event||String(r.eventId)===event)&&(!mode||(mode==='revoked'?r.revoked:r.stampMode===mode&&!r.revoked))&&(!from||d>=from)&&(!to||d<=to)}).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))}
function renderHistory(){const list=filteredRecords();el('recordCount').textContent=`該当 ${list.length}件`;el('recordList').innerHTML=list.slice(0,200).map(r=>`<div class="item"><strong>${esc(r.userName)}</strong> ／ ${esc(r.eventName)} <span class="pill ${r.revoked?'revoked':''}">${r.revoked?'スタンプ訂正済み':r.stampMode==='on'?'+1 スタンプ':'参加のみ'}</span><br><span class="muted">${esc(date(r.timestamp))} ／ ${esc(r.userId)}</span>${r.stampMode==='on'?`<br><button data-correct="${esc(r.recordId)}">${r.revoked?'訂正を戻す':'スタンプを取り消す'}</button>`:''}</div>`).join('')||'履歴なし';el('correctionList').innerHTML=state.corrections.slice().reverse().slice(0,100).map(c=>{const r=state.records.find(x=>String(x.recordId)===String(c.recordId));return `<div class="item">${c.action==='revoke'?'取消':'復元'}：${esc(r?.userName||'不明')} ／ ${esc(r?.eventName||'不明')}<br><span class="muted">${esc(date(c.timestamp))} ／ 理由：${esc(c.reason)} ／ 操作者：${esc(c.adminUserId)}</span></div>`}).join('')||'訂正履歴なし'}
function renderStats(){el('eventStatsList').innerHTML=state.eventStats.map(s=>{const e=state.events.find(x=>String(x.eventId)===String(s.eventId));return `<div class="item"><strong>${esc(e?.eventName||s.eventName||s.eventId)}</strong> <span class="muted">${esc(s.eventId)}</span><br>参加記録 ${s.attendance}件 ／ 参加者 ${s.participants}人 ／ 有効スタンプ ${s.stamps}個 ／ 訂正中 ${s.corrections}件</div>`}).join('')||'集計対象なし'}
function todayJapan(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return p.year+p.month+p.day}
function previewEvent(){const code=el('activityType').value;el('eventPreview').textContent=code?'作成されるイベントID：'+code+todayJapan():'活動の種類を選択してください。'}
function renderActivities(){const selected=el('activityType').value;el('activityType').innerHTML='<option value="">選択してください</option>'+state.activityTypes.map(a=>`<option value="${esc(a.code)}">${esc(a.name)}（${esc(a.code)}）</option>`).join('');el('activityType').value=selected;previewEvent();el('activityList').innerHTML=state.activityTypes.map(a=>`<div class="item">${esc(a.name)} <span class="muted">${esc(a.code)}</span> <button class="danger" data-activity-delete="${esc(a.code)}">削除</button></div>`).join('')||'活動の種類は未登録です。'}
function renderAdmins(){const allowed=!!state.canManageAdmins;el('admins').hidden=!allowed;el('adminsLink').hidden=!allowed;if(!allowed)return;const selected=el('newAdmin').value;el('newAdmin').innerHTML='<option value="">選択してください</option>'+state.users.filter(u=>!state.adminUsers.some(a=>String(a.userId)===String(u.userId))).map(u=>`<option value="${esc(u.userId)}">${esc(u.userName)}（${esc(u.userId)}）</option>`).join('');el('newAdmin').value=selected;el('adminList').innerHTML=state.adminUsers.map(a=>`<div class="item"><strong>${esc(a.userName)}</strong> <span class="muted small">${esc(a.userId)}</span><br><button data-remove-admin="${esc(a.userId)}" ${String(a.userId)===String(state.currentAdminId)||state.adminUsers.length<2?'disabled':''}>管理者から外す</button></div>`).join('');el('adminAuditList').innerHTML=state.adminAudit.slice().reverse().slice(0,30).map(a=>`<div class="item">${a.action==='add'?'追加':'解除'}：${esc(a.userId)}<br><span class="muted">${esc(date(a.timestamp))} ／ 操作者：${esc(a.adminUserId)}</span></div>`).join('')||'変更履歴なし'}
function showQR(e){if(!e?.code){status('QRコードがありません。',true);return}const url=new URL(STAMP_URL);url.searchParams.set('event',e.eventId);url.searchParams.set('code',e.code);const box=el('qr');box.replaceChildren();const p=document.createElement('p');p.textContent=`${e.eventName} ／ ${e.status==='paused'?'受付停止中 ／ ':''}有効期限 ${date(e.expiresAt)}`;const a=document.createElement('a');a.href=url.href;a.textContent=url.href;const holder=document.createElement('div');holder.style.marginTop='12px';box.append(p,a,holder);if(window.QRCode)new QRCode(holder,{text:url.href,width:260,height:260});else status('QR画像を読み込めませんでした。URLをご利用ください。',true);box.scrollIntoView({behavior:'smooth'})}
function csvSafe(value){const s=String(value??'');return /^[\s]*[=+\-@]/.test(s)?"'"+s:s}
function download(name,rows){const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+csvSafe(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function confirmAction(title,details,{reason=false}={}){return new Promise(resolve=>{const dialog=el('confirmDialog');el('dialogTitle').textContent=title;el('dialogDetails').textContent=details;el('dialogReasonWrap').hidden=!reason;el('dialogReason').value='';const cleanup=value=>{dialog.close();el('dialogCancel').onclick=null;el('dialogConfirm').onclick=null;dialog.oncancel=null;resolve(value)};el('dialogCancel').onclick=()=>cleanup(null);el('dialogConfirm').onclick=()=>{const value=reason?el('dialogReason').value.trim():true;if(reason&&(value.length<3||value.length>200)){status('理由を3〜200文字で入力してください。',true);return}cleanup(value)};dialog.oncancel=ev=>{ev.preventDefault();cleanup(null)};dialog.showModal()})}
el('activityType').onchange=previewEvent;
el('addActivity').onclick=async()=>{const name=el('activityName').value.trim(),code=el('activityCode').value.trim().toLowerCase();if(!name||!/^[a-z]{2,32}$/.test(code)){status('活動名と英小文字2〜32文字のコードを入力してください。',true);return}await run('activityAdd',{name,code},'活動の種類を登録しました。')};
el('activityList').onclick=async ev=>{const code=ev.target.closest('button')?.dataset.activityDelete;if(!code)return;const yes=await confirmAction('活動の種類を削除',`${code} を削除します。作成済みイベントがある活動は削除できません。`);if(yes)await run('activityDelete',{code},'活動の種類を削除しました。')};
el('createEvent').onclick=async()=>{try{const activityCode=el('activityType').value,raw=el('expiresAt').value;if(!activityCode||!raw)throw Error('活動の種類と有効期限を選択してください。');const result=await api('eventCreate',{activityCode,stampMode:el('stampMode').value,expiresAt:new Date(raw).toISOString()});await refresh();showQR(state.events.find(e=>String(e.eventId)===result.eventId));status('イベントを作成しました。QRをご利用ください。')}catch(e){status(e.message,true)}};
el('updateEvent').onclick=async()=>{try{if(!editEventId||!el('editExpiresAt').value)throw Error('イベントと有効期限を確認してください。');const id=editEventId;await api('eventUpdate',{eventId:id,stampMode:el('editStampMode').value,expiresAt:new Date(el('editExpiresAt').value).toISOString()});await refresh();showQR(state.events.find(e=>String(e.eventId)===id));status('更新しました。新しいQRをご利用ください。')}catch(e){status(e.message,true)}};
el('eventList').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const i=b.dataset.edit??b.dataset.qr??b.dataset.toggle??b.dataset.delete,e=state.events[Number(i)];if(!e)return;if(b.dataset.edit!==undefined){editEventId=String(e.eventId);el('editEventLabel').textContent=e.eventName+' ／ '+e.eventId;el('editStampMode').value=e.stampMode;el('editExpiresAt').value=new Date(e.expiresAt).toLocaleString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,16);el('editPanel').hidden=false;el('editPanel').scrollIntoView({behavior:'smooth'})}else if(b.dataset.qr!==undefined)showQR(e);else if(b.dataset.toggle!==undefined){const next=e.status==='paused'?'open':'paused';const yes=await confirmAction(next==='paused'?'受付を停止':'受付を再開',`${e.eventName}の受付を${next==='paused'?'停止':'再開'}します。`);if(yes)await run('eventStatus',{eventId:e.eventId,status:next},'受付状態を変更しました。')}else{const yes=await confirmAction('イベントを削除',`${e.eventName}を削除します。参加履歴は残ります。`);if(yes){await run('eventDelete',{eventId:e.eventId},'イベントを削除しました。');if(editEventId===String(e.eventId)){editEventId=null;el('editPanel').hidden=true}}}};
el('userList').onclick=async ev=>{const uid=ev.target.closest('button')?.dataset.redeem;if(!uid)return;const u=state.users.find(x=>String(x.userId)===uid);const yes=await confirmAction('特典の使用を確定',`${u.userName}さん ／ 利用可能 ${u.availableBonus}個 → 使用後 ${u.availableBonus-1}個。特典を渡したことを確認してください。`);if(yes)await run('redeem',{userId:uid},'特典を使用済みにしました。')};
el('recordList').onclick=async ev=>{const id=ev.target.closest('button')?.dataset.correct;if(!id)return;const r=state.records.find(x=>String(x.recordId)===id);if(!r)return;const action=r.revoked?'restore':'revoke';const reason=await confirmAction(action==='revoke'?'スタンプを取り消す':'スタンプ訂正を戻す',`${r.userName}さん ／ ${r.eventName} ／ ${date(r.timestamp)}。参加記録は残し、スタンプ数だけ訂正します。`,{reason:true});if(reason)await run('correctStamp',{recordId:id,action,reason},'スタンプを訂正しました。')};
el('adminList').onclick=async ev=>{const uid=ev.target.closest('button')?.dataset.removeAdmin;if(!uid)return;const yes=await confirmAction('管理者を解除',`${state.adminUsers.find(a=>String(a.userId)===uid)?.userName||uid}さんの管理権限を外します。`);if(yes)await run('adminRemove',{userId:uid},'管理者を解除しました。')};
el('addAdmin').onclick=async()=>{const uid=el('newAdmin').value;if(!uid){status('参加者を選択してください。',true);return}const u=state.users.find(x=>String(x.userId)===uid);const yes=await confirmAction('管理者を追加',`${u.userName}さんにイベント・スタンプ訂正・特典操作の権限を与えます。`);if(yes)await run('adminAdd',{userId:uid},'管理者を追加しました。')};
['userSearch'].forEach(id=>el(id).oninput=renderUsers);['filterEvent','filterMode','dateFrom','dateTo','historySearch'].forEach(id=>{el(id).addEventListener('input',renderHistory);el(id).addEventListener('change',renderHistory)});
el('csvRecords').onclick=()=>download('filtered_stamp_records.csv',[['userId','userName','eventId','eventName','timestamp','stampMode','revoked'],...filteredRecords().map(r=>[r.userId,r.userName,r.eventId,r.eventName,r.timestamp,r.stampMode,r.revoked?'yes':'no'])]);
el('csvBonus').onclick=()=>download('bonus_users.csv',[['userId','userName','stampCount','earnedBonus','redeemedBonus','availableBonus'],...state.users.map(u=>[u.userId,u.userName,u.stampCount,u.earnedBonus,u.redeemedBonus,u.availableBonus])]);
(async()=>{try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}await refresh();el('panel').hidden=false}catch(e){status(e.message||'管理者として認証できませんでした。',true)}})();
</script></body></html>
