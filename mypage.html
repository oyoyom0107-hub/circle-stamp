<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタンプカード | MatchPoint</title><style>
:root{font-family:system-ui,sans-serif;color:#17324c}body{margin:0;background:#eef8f7}.header{background:#168b77;color:#fff;text-align:center;padding:22px}main{max-width:680px;margin:20px auto;padding:0 16px}.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 18px #17324c12}.stamps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.stamp{width:42px;height:42px;border-radius:50%;border:2px solid #168b77;display:grid;place-items:center;color:#168b77;font-size:24px}.stamp.on{background:#168b77;color:#fff}.big{font-size:22px;font-weight:700}.record{padding:12px 0;border-top:1px solid #e5eeee}.muted{color:#577080;font-size:14px}.error{color:#b13232}
</style></head><body><header class="header"><h1>MatchPoint スタンプカード</h1></header><main><section class="card" id="summary">読み込み中...</section><section class="card"><h2>参加履歴</h2><div id="records"></div></section></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbw-gxI5JurV-bRswZv1BGcWC2r7tkyK2XbeVBBy6BTysyTpxYpw5_3ENr3Y5etClIIS/exec';const LIFF_ID='2011752461-qIktF1m8';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const summary=document.getElementById('summary');try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}const accessToken=liff.getAccessToken();if(!accessToken)throw Error('LINEから開き直してください。');const response=await fetch(API,{method:'POST',body:JSON.stringify({type:'mypage',accessToken})});const data=await response.json();if(!data.ok)throw Error(data.message||'読み込めませんでした。');const count=data.stampCount;const rem=count%5;const toNext=5-rem;summary.innerHTML=`<div class="big">合計スタンプ：${count}個</div><div class="stamps">${Array.from({length:5},(_,i)=>`<span class="stamp ${i<rem?'on':''}">${i<rem?'●':'○'}</span>`).join('')}</div><p>${rem===0&&count>0?'🎉 5回の参加で特典を獲得しました！':`あと${toNext}回で次の特典！`}</p><p>🎁 利用可能な特典：<strong>${data.availableBonus}個</strong></p><p class="muted">獲得 ${data.earnedBonus}個 ／ 使用済み ${data.redeemedBonus}個</p>${data.availableBonus>0?'<p>特典を受け取る際はスタッフにお声がけください。</p>':''}`;document.getElementById('records').innerHTML=data.records.length?data.records.map(r=>`<div class="record"><strong>${escapeHtml(r.eventName)}</strong> ${r.stampMode==='on'?'+1 スタンプ':'参加記録のみ'}<div class="muted">${escapeHtml(new Date(r.timestamp).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))}</div></div>`).join(''):'まだ参加履歴がありません。'}catch(e){summary.className+=' error';summary.textContent=e.message||'通信エラーが発生しました。'}})();
</script></body></html>
