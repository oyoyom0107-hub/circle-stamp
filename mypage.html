<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>スタンプカード | MatchPoint</title>
  <style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#093e39;font-synthesis:none}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(ellipse at top,#e7f3ed,#f6faf7 50%,#edf6f1);line-height:1.6}main,.header{width:100%;max-width:680px;margin:auto;padding:0 18px}main{padding-bottom:36px}.header{padding-top:26px;padding-bottom:22px;display:flex;align-items:center;gap:12px}.header h1{font-size:clamp(24px,6.7vw,35px);font-weight:750;letter-spacing:-.035em;margin:0;line-height:1.1}.header h1 span{display:block;font-size:12px;letter-spacing:.12em;font-weight:600;margin-top:9px;color:#56766b}.member-mark{margin-left:auto;flex:none;border:1.5px solid #075d56;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}.member-mark svg{width:24px;height:24px}.card{background:#ffffffeb;border:1px solid #e4eee8;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 8px 25px #064b3810}h2{font-size:19px;margin:0 0 15px;font-weight:750}.muted{font-size:13px;color:#688079}.shop{position:relative;overflow:hidden;border:2px solid #d9bb64;background:radial-gradient(ellipse at 85% 10%,#168a7060,transparent 65%),linear-gradient(130deg,#00453e,#086452 65%,#00443a);color:#fff;padding:24px 22px;box-shadow:0 10px 28px #064c3525}.shop:before{content:"";position:absolute;left:-15%;top:3%;width:125%;height:110px;border-bottom:1px solid #dfc87b;border-radius:50%;transform:rotate(-11deg);opacity:.65;pointer-events:none}.shop:after{content:"";position:absolute;left:-35%;bottom:-160px;width:450px;height:220px;border:1px solid #dfc87b;border-radius:50%;transform:rotate(15deg);opacity:.35;pointer-events:none}.shop>*{position:relative;z-index:1}.shop-brand{font-family:Georgia,serif;font-size:30px;letter-spacing:.025em;line-height:1.1;margin:0 0 8px}.shop h2{color:#fff;font-size:16px;margin:0}.member-caption{position:absolute;right:0;top:6px;font-size:9px;letter-spacing:.2em;color:#e1c979}.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0 20px}.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #d8e8d066;color:#91bbaa55;display:grid;place-items:center}.stamp svg{width:55%;height:55%;fill:currentColor}.stamp.on{background:linear-gradient(130deg,#fffce5,#e5cf8b);border:2px solid #e8d494;box-shadow:0 4px 10px #001f3540;color:#065849;outline:1px solid #f9e5a3;outline-offset:3px}.progress{display:flex;align-items:center;justify-content:center;gap:15px;margin:8px 0;font-size:14px}.big{font-family:Georgia,serif;color:#e8d17f;font-size:49px;line-height:1.1;white-space:nowrap}.big small{font-size:26px}.progress-text{border-left:1px solid #d9e7d560;padding-left:15px}.bonus-row{margin:15px 0 6px;text-align:center}.bonus{display:inline-block;border:1px solid #d1bd76;color:#f5e6a5;border-radius:30px;padding:5px 12px;font-size:12px}.totals{color:#d2e7dd;font-size:11px;text-align:center;margin:7px 0 15px}.shop .muted{color:#d2e7dd}.bonus-help{font-size:12px;text-align:center;margin:8px 0}.shop-actions{display:flex;gap:10px;align-items:center;border-top:1px solid #d1e6dc40;padding-top:18px}.scan-button,.refresh-button{font:inherit;cursor:pointer;min-height:44px;border-radius:99px;font-weight:700}.scan-button{flex:1;min-width:0;border:0;background:#fafcf5;color:#07564a;padding:12px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}.scan-button svg{width:22px;height:22px;flex:none}.refresh-button{flex:none;border:1px solid #a9ccba70;background:transparent;color:#fff;padding:8px 11px;font-size:11px}.scan-button:disabled,.refresh-button:disabled{opacity:.5;cursor:not-allowed}.shop-status{font-size:11px;margin:8px 0 0;line-height:1.5;overflow-wrap:anywhere}.shop-status:empty{display:none}.error{color:#a62d3f}.shop .error{color:#ffcfca}.section-heading{display:flex;align-items:center;gap:10px}.section-heading svg{width:23px;height:23px;flex:none}.upcoming .item{padding:14px 0;border-top:1px solid #e1ece5}.upcoming .item:first-child{border:0;padding-top:0}.upcoming .item:last-child{padding-bottom:0}.item strong{font-size:17px;overflow-wrap:anywhere}.pill,.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:#e6f2e9;color:#176c52}.pill{float:right;margin-left:8px}.pill.done,.tag.off{color:#687970;background:#edf1ee}.notice{clear:both;font-size:13px;line-height:1.7;padding-top:6px;overflow-wrap:anywhere}.history-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}.history-menu a{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5eee7;border-radius:18px;padding:18px 13px;color:#114b40;text-decoration:none;box-shadow:0 5px 20px #064b3809;font-weight:700;font-size:14px}.history-menu svg{width:30px;height:30px;flex:none}.history-menu span{margin-left:auto;font-size:20px}.record{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-top:1px solid #e5eee7;padding:13px 0;font-size:14px}.record strong{overflow-wrap:anywhere}.tag{flex:none;white-space:nowrap}.month{font-size:14px;color:#26785d;margin:18px 0 8px}.monthly-item{display:flex;justify-content:space-between;border-top:1px solid #e5eee7;padding:10px 0;font-size:14px}.card[id]{scroll-margin-top:18px}button:focus-visible,a:focus-visible{outline:3px solid #c59f44;outline-offset:3px}@media(max-width:390px){main,.header{padding-left:14px;padding-right:14px}.shop{padding:22px 17px}.stamps{gap:10px}.shop-brand{font-size:27px}.member-caption{font-size:8px}.shop-actions{gap:7px}.scan-button{font-size:12px;padding:12px 9px}.refresh-button{font-size:10px;padding:8px}.progress{gap:10px}.big{font-size:43px}.card{padding:18px}.history-menu a{padding:16px 11px;font-size:12px}}

/* Separate stamp progress, controls, and reward information. */
.shop-brand{text-align:center;color:#f1db91;font-size:clamp(30px,8vw,42px)}
.shop h2{text-align:center;color:#f1dfac;font-size:15px;letter-spacing:.04em}.member-caption{display:none}
.stamp:not(.on) svg{display:none}.stamp{border-color:#cfb767}.stamps{margin-top:28px}
.shop .totals{margin:12px 0 0}.shop .progress-text{font-size:14px}
.outside-actions{margin:0 0 20px}.outside-actions .shop-actions{border:0;padding:0;gap:10px}
.outside-actions .scan-button{background:linear-gradient(110deg,#08766a,#00554b);color:white;border-radius:16px;min-height:48px;box-shadow:0 5px 16px #064b3814}
.outside-actions .refresh-button{background:#e0f0e9;border:0;color:#075d56;border-radius:16px;min-height:44px;padding:9px 12px;font-size:11px}
.outside-actions .shop-status{color:#688079}.outside-actions .error{color:#a62d3f}
.rewards h2{border-bottom:1px solid #e4ece8;padding-bottom:12px;margin-bottom:16px}
.reward-label{text-align:center;font-size:14px;color:#698077;margin:0}.reward-count{text-align:center;font-size:50px;font-weight:750;line-height:1.2;margin:4px 0 16px}.reward-count small{font-size:20px;margin-left:5px}
.reward-totals{background:#f0f6f3;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:13px;color:#61766d;padding:13px 10px}.reward-totals strong{color:#124c41}.reward-help{text-align:center;margin:14px 0 0;font-size:12px}
@media(max-width:360px){.outside-actions .shop-actions{gap:7px}.outside-actions .refresh-button{font-size:10px;padding:8px}.shop .progress-text{font-size:12px}}

.new-badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:99px;background:#f5d778;color:#594817;font-size:10px;font-weight:800;letter-spacing:.06em}
.notice-open{display:block;margin-top:10px;padding:8px 12px;border:1px solid #c7e3d6;border-radius:10px;color:#075b4e;background:#eef8f2;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.collection-item{padding:15px 0;border-top:1px solid #e1ece5}.collection-item:first-child{border:0;padding-top:0}.collection-item:last-child{padding-bottom:0}.collection-item strong{display:block;font-size:15px;overflow-wrap:anywhere}.collection-status{display:inline-block;margin-bottom:6px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#fff0cf;color:#775515}.collection-status.paid{background:#e1f3e9;color:#176c52}.collection-amount{font-size:21px;font-weight:750;margin:5px 0;color:#0a594b}.collection-item .muted{font-size:12px}
.member-dialog{width:calc(100% - 36px);max-width:410px;max-height:85dvh;overflow:auto;border:1px solid #dbeae1;border-radius:24px;padding:26px 22px;background:#fff;color:#093e39;box-shadow:0 20px 60px #003b3533}.member-dialog::backdrop{background:#002e2866}.member-dialog h2{font-size:22px;line-height:1.4;margin:14px 0 10px;overflow-wrap:anywhere}.member-dialog p{overflow-wrap:anywhere}.member-dialog button{font:inherit;border:0;border-radius:12px;background:#076a59;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:14px}.result-icon{width:64px;height:64px;border-radius:50%;background:#e1f3e9;color:#08705a;margin:auto;display:grid;place-items:center;font-size:34px;font-weight:750}.result-icon.info{background:#e9f2f8;color:#347286}.result-icon.warning{background:#fff1d6;color:#9e741d}.result-icon.error{background:#fce8ec;color:#a62d3f}#qr-result-dialog{text-align:center}#qr-result-event{font-weight:700}#qr-result-detail{color:#688079;font-size:14px}#notice-dialog-details{font-size:14px;line-height:1.8;white-space:pre-line}#notice-dialog-state{font-size:12px}

.member-mark{background:#f8fcf9;color:#075d56;cursor:pointer;padding:0;min-width:44px;min-height:44px}.page-toolbar{display:flex;justify-content:flex-end;margin:-6px 0 12px}.page-toolbar .refresh-button{color:#075d56;background:#e0f0e9;border:0;padding:6px 10px;font-size:11px;min-height:32px}.profile-back{font:inherit;font-size:13px;font-weight:700;color:#075d56;background:#e0f0e9;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;margin-bottom:18px}.profile-card{text-align:center}.profile-avatar{display:grid;place-items:center;margin:0 auto 14px;width:55px;height:55px;border-radius:50%;color:#08705a;background:#e1f3e9;font-size:26px}.profile-name{font-size:24px;font-weight:750;overflow-wrap:anywhere;margin:8px 0}.reward-compact{font-size:20px;font-weight:750;margin:0 0 12px}.card details summary{cursor:pointer;font-size:13px;color:#176c52;padding:8px 0}.card details[open]>summary{margin-bottom:10px}#profile-screen{scroll-margin-top:16px}.collection-paid{margin-top:14px}.notice-count{font-size:12px;color:#926c18;margin:0 0 10px}
</style>
</head>
<body>
<header class="header"><h1>MatchPoint<span>マイページ</span></h1><button type="button" id="profile-button" class="member-mark" aria-label="プロフィールと履歴を開く" aria-controls="profile-screen" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3z"/></svg></button></header>
<main>
<div id="mypage-screen"><div class="page-toolbar"><button type="button" id="refresh-button" class="refresh-button" disabled>↻ 表示を更新</button></div>
<section class="card shop" aria-label="ショップカード"><div id="summary" aria-live="polite">読み込み中...</div></section>
<div class="outside-actions"><div class="shop-actions"><button type="button" id="scan-button" class="scan-button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h-3zM21 15v6h-6M12 3v3M12 12h3M3 12h3M12 18v3"/></svg>QRコードを読み取る</button></div><p id="refresh-status" class="shop-status muted" role="status">読み込み中...</p><p id="scan-status" class="shop-status muted" role="status">読み取り機能を確認中...</p></div>
<section class="card rewards" aria-labelledby="reward-heading"><h2 id="reward-heading" class="section-heading"><span aria-hidden="true">🎁</span>特典</h2><p id="reward-compact" class="reward-compact" aria-live="polite">読み込み中...</p><details><summary>特典の詳細を見る</summary><div id="reward-summary" aria-live="polite">読み込み中...</div></details></section>
<section class="card" aria-labelledby="collection-heading"><h2 id="collection-heading" class="section-heading"><span aria-hidden="true">▤</span>自分の集金状況</h2><div id="member-collections" aria-live="polite">読み込み中...</div></section>
<section class="card upcoming"><h2 class="section-heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5M17 3v5M3 11h18M7 15h3M14 15h3"/></svg>参加予定・お知らせ</h2><div id="upcoming">読み込み中...</div></section>
</div>
<section id="profile-screen" hidden aria-labelledby="profile-heading">
<button type="button" id="profile-back" class="profile-back">← マイページに戻る</button>
<section class="card profile-card"><span class="profile-avatar" aria-hidden="true">●</span><h2 id="profile-heading">プロフィール</h2><p id="profile-name" class="profile-name" aria-live="polite">LINE名を確認中...</p><p class="muted">あなたの参加・特典の記録</p></section>
<nav class="history-menu" aria-label="履歴"><a href="#history-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></svg>参加履歴<span aria-hidden="true">›</span></a><a href="#bonus-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12v9h16v-9M12 7v14"/><rect x="2" y="7" width="20" height="5" rx="1"/><path d="M12 7C3 8 5-2 12 7c7-9 9 1 0 0"/></svg>特典履歴<span aria-hidden="true">›</span></a></nav>
<section class="card" id="history-card"><h2>スタンプ・参加履歴</h2><div id="records"></div></section>
<section class="card"><h2>月別の参加回数</h2><p class="muted">スタンプなしの参加、集金の受付、スタンプを訂正した参加も含みます。</p><div id="monthly-counts"></div></section>
<section class="card" id="bonus-card"><h2>特典の利用履歴</h2><div id="redemptions"></div></section>
</section>
</main>
<dialog id="qr-result-dialog" class="member-dialog" aria-labelledby="qr-result-title"><div id="qr-result-icon" class="result-icon" aria-hidden="true"></div><h2 id="qr-result-title"></h2><p id="qr-result-event"></p><p id="qr-result-detail"></p><button id="qr-result-close" type="button">マイページに戻る</button></dialog>
<dialog id="notice-dialog" class="member-dialog" aria-labelledby="notice-dialog-title"><h2 id="notice-dialog-title"></h2><div id="notice-dialog-details"></div><p id="notice-dialog-state" role="status"></p><button id="notice-dialog-close" type="button">閉じる</button></dialog>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbxTYedx5VBpe5BPyIsQx0iNwS_3xZ3EaWfQDDyOGSQhP3TK6J0F-VWRfYvTjaOATawn/exec';
const LIFF_ID='2011752461-qIktF1m8';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scanButton=document.getElementById('scan-button');
const scanStatus=document.getElementById('scan-status');
const refreshButton=document.getElementById('refresh-button');
const refreshStatus=document.getElementById('refresh-status');
const formatDate=v=>new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const formatMonth=v=>new Date(v).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long'});


let profileReturnScroll=0;
function showProfile(open){
 if(open)profileReturnScroll=window.scrollY;
 document.getElementById('mypage-screen').hidden=open;
 document.getElementById('profile-screen').hidden=!open;
 document.getElementById('profile-button').setAttribute('aria-expanded',String(open));
 window.scrollTo({top:open?0:profileReturnScroll,behavior:'instant'});
 if(open)document.getElementById('profile-back').focus({preventScroll:true});
 else document.getElementById('profile-button').focus({preventScroll:true});
}
document.getElementById('profile-button').addEventListener('click',()=>showProfile(document.getElementById('profile-screen').hidden));
document.getElementById('profile-back').addEventListener('click',()=>showProfile(false));
async function loadProfileName(){try{const profile=await liff.getProfile();document.getElementById('profile-name').textContent=profile.displayName||'名前未登録'}catch(error){document.getElementById('profile-name').textContent='LINE名を取得できませんでした'}}

let dashboardData=null;
async function memberRequest(type,fields={}){
 const accessToken=liff.getAccessToken();if(!accessToken)throw Error('LINEから開き直してください。');
 const response=await fetch(API,{method:'POST',body:JSON.stringify({type,accessToken,...fields})});
 if(!response.ok)throw Error('通信エラーが発生しました。');return response.json();
}
function collectionQR(eventId){return String(eventId).startsWith('shuukin')||String(eventId).startsWith('saakurutiishatsushuukin')}
function qrResultView(data,eventId){
 const collection=collectionQR(eventId),name=data.eventName||dashboardData?.collections?.find(c=>String(c.eventId)===eventId)?.eventName||dashboardData?.upcoming?.find(e=>String(e.eventId)===eventId)?.eventName||'';
 if(data.ok){if(collection)return {title:'集金受付が完了しました',event:name,detail:'集金済みとして記録しました。スタンプの付与はありません。',icon:'✓',kind:'success'};if(data.stampMode==='on')return {title:'スタンプを1個獲得しました！',event:name,detail:`累計 ${Number(data.stampCount)||0}スタンプ${data.availableBonus>0?' ／ 利用できる特典 '+data.availableBonus+'個':''}`,icon:'+1',kind:'success'};return {title:'参加を記録しました',event:name,detail:'今回は参加記録のみです。スタンプの付与はありません。',icon:'✓',kind:'success'}}
 const views={ALREADY_RECORDED:{title:collection?'この集金は集金済みです':'このイベントは記録済みです',detail:collection?'追加の集金記録は作成していません。':'同じイベントのスタンプ・参加記録は1回だけ取得できます。',icon:'i',kind:'info'},EXPIRED:{title:'QRコードの期限が切れています',detail:'スタッフに新しいQRコードをご確認ください。',icon:'⌛',kind:'warning'},PAUSED:{title:'受付を停止しています',detail:'スタッフに受付状況をご確認ください。',icon:'Ⅱ',kind:'warning'},INVALID_QR:{title:'このQRコードは使用できません',detail:'スタッフが現在表示しているQRコードを読み取ってください。',icon:'!',kind:'warning'}};
 return {...(views[data.code]||{title:'受付できませんでした',detail:data.message||'スタッフにご確認ください。',icon:'!',kind:'error'}),event:name};
}
function showQRResult(view){
 document.getElementById('qr-result-title').textContent=view.title;document.getElementById('qr-result-event').textContent=view.event||'';document.getElementById('qr-result-detail').textContent=view.detail;
 const icon=document.getElementById('qr-result-icon');icon.textContent=view.icon;icon.className='result-icon '+view.kind;
 const dialog=document.getElementById('qr-result-dialog');if(!dialog.open)dialog.showModal();
}
document.getElementById('qr-result-close').addEventListener('click',()=>document.getElementById('qr-result-dialog').close());
scanButton.addEventListener('click',async()=>{
 scanButton.disabled=true;scanStatus.className='shop-status muted';scanStatus.textContent='カメラを起動しています...';let submitted=false;
 try{
  const result=await liff.scanCodeV2();if(!result?.value){scanStatus.textContent='読み取りがキャンセルされました。';return}
  let scanned;try{scanned=new URL(result.value)}catch(e){throw Error('このサークルの参加用QRコードを読み取ってください。')}
  const expected=new URL('stamp/index.html',location.href);
  if(scanned.origin!==expected.origin||scanned.pathname!==expected.pathname||!scanned.searchParams.get('event')||!scanned.searchParams.get('code'))throw Error('このサークルの参加用QRコードを読み取ってください。');
  const eventId=scanned.searchParams.get('event');scanStatus.textContent='受付結果を確認しています...';submitted=true;
  const data=await memberRequest('stamp',{eventId,code:scanned.searchParams.get('code')});showQRResult(qrResultView(data,eventId));scanStatus.textContent='';
  if(data.ok||data.code==='ALREADY_RECORDED')await loadMyPage();
 }catch(error){scanStatus.className='shop-status error';scanStatus.textContent=error.message||'読み取りに失敗しました。';showQRResult({title:submitted?'受付結果を確認できませんでした':'QRコードを読み取れませんでした',event:'',detail:submitted?'通信状況を確認し、「表示を更新」で記録をご確認ください。':scanStatus.textContent,icon:'!',kind:'error'})}
 finally{scanButton.disabled=false}
});
function renderMemberCollections(data){
 const collections=data.collections||[],today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
 const item=c=>{const paid=c.status==='集金済み',period=c.startDate&&c.endDate?`${escapeHtml(c.startDate.replaceAll('-','/'))} 〜 ${escapeHtml(c.endDate.replaceAll('-','/'))}`:'期間未設定';return `<div class="collection-item"><span class="collection-status ${paid?'paid':''}">${paid?'集金済み':'未集金'}</span><strong>${escapeHtml(c.eventName)}</strong><div class="collection-amount">${c.amount==null?'料金未設定':Number(c.amount).toLocaleString('ja-JP')+'円'}</div><div class="muted">集金期間：${period}${paid&&c.paidAt?'<br>受付日時：'+escapeHtml(formatDate(c.paidAt)):!paid&&c.startDate&&today<c.startDate?'<br>集金開始前です。':!paid&&c.endDate&&today>c.endDate?'<br>集金期間は終了しています。スタッフにご確認ください。':''}</div></div>`};
 const pending=collections.filter(c=>c.status!=='集金済み'),paid=collections.filter(c=>c.status==='集金済み');
 document.getElementById('member-collections').innerHTML=(pending.length?pending.map(item).join(''):'<p class="muted">未集金の項目はありません。</p>')+(paid.length?'<details class="collection-paid"><summary>集金済み '+paid.length+'件を確認</summary>'+paid.map(item).join('')+'</details>':'');
}
function renderMemberNotices(data){
 const upcoming=data.upcoming||[];
 const items=upcoming.map(e=>`<div class="item"><strong>${escapeHtml(e.eventName)}</strong>${e.noticeUnread?'<span class="new-badge">NEW</span>':''}<span class="pill ${['受付済み','集金済み','期限切れ'].includes(e.status)?'done':''}">${escapeHtml(e.status)}</span>${e.noticeVersion?`<button class="notice-open" type="button" data-open-notice="${escapeHtml(e.eventId)}">${e.noticeUnread?'新しいお知らせを開く':'お知らせを確認'}</button>`:''}</div>`);
 const unread=upcoming.filter(e=>e.noticeUnread).length;document.getElementById('upcoming').innerHTML=(unread?'<p class="notice-count">未読のお知らせ '+unread+'件</p>':'')+(items.length?items.slice(0,3).join(''):'参加予定のイベントはありません。')+(items.length>3?'<details><summary>ほかの予定・お知らせ '+(items.length-3)+'件</summary>'+items.slice(3).join('')+'</details>':'');
}
let noticeOpenId='';
document.getElementById('upcoming').addEventListener('click',async ev=>{
 const button=ev.target.closest('[data-open-notice]');if(!button||button.disabled)return;const id=button.dataset.openNotice,e=dashboardData?.upcoming?.find(e=>String(e.eventId)===id);if(!e)return;
 noticeOpenId=id;button.disabled=true;document.getElementById('notice-dialog-title').textContent=e.eventName;document.getElementById('notice-dialog-details').textContent=[e.startsAt?'日時：'+formatDate(e.startsAt):'',e.location?'場所：'+e.location:'',e.belongings?'持ち物：'+e.belongings:''].filter(Boolean).join('\n');const message=document.getElementById('notice-dialog-state');message.textContent=e.noticeUnread?'既読を保存しています...':'';message.className='muted';document.getElementById('notice-dialog').showModal();
 try{if(e.noticeUnread){const result=await memberRequest('noticeMarkRead',{eventId:id,noticeVersion:e.noticeVersion});if(!result.ok)throw Error(result.message||'既読を保存できませんでした。');if(dashboardData){const current=dashboardData.upcoming.find(x=>String(x.eventId)===id);if(current&&current.noticeVersion===e.noticeVersion){current.noticeUnread=false;renderMemberNotices(dashboardData)}}if(noticeOpenId===id)message.textContent=''}}catch(error){if(noticeOpenId===id){message.className='error';message.textContent=error.message||'既読を保存できませんでした。もう一度お知らせを開いてください。'}}finally{button.disabled=false}
});
document.getElementById('notice-dialog-close').addEventListener('click',()=>{noticeOpenId='';document.getElementById('notice-dialog').close()});

function renderMyPage(data){
    dashboardData=data;renderMemberCollections(data);renderMemberNotices(data);document.getElementById('reward-compact').textContent='利用できる特典 '+data.availableBonus+'個';
    const summary=document.getElementById('summary');
    summary.classList.remove('error');
    const history=[...(data.records||[])].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    const monthly=new Map();
    history.forEach(r=>{const month=formatMonth(r.timestamp);monthly.set(month,(monthly.get(month)||0)+1)});
    document.getElementById('monthly-counts').innerHTML=monthly.size
      ?[...monthly].map(([month,count])=>`<div class="monthly-item"><span>${escapeHtml(month)}</span><strong>${count}回</strong></div>`).join('')
      :'まだ参加履歴がありません。';
    const count=data.stampCount;
    const rem=count%5;
    const toNext=5-rem;
    summary.innerHTML=`<div class="shop-brand">MatchPoint</div><span class="member-caption">CLUB MEMBER</span><h2>ショップ スタンプカード</h2><div class="stamps" role="img" aria-label="5個ごとに特典。今回のカードは${rem}個獲得済み">${Array.from({length:5},(_,i)=>`<span class="stamp ${i<rem?'on':''}" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 33 20 9c1-3 5-2 5 1L15 35zm8 3L28 9c2-3 6-1 4 2L23 39zm9 4 10-24c2-3 6-1 4 2L32 43zM8 35c-4 4-2 9 2 11 4 1 7-1 8-4z"/></svg></span>`).join('')}</div><div class="progress"><span class="big">${rem}<small> / 5</small></span><span class="progress-text">あと <strong>${toNext}回</strong>で特典</span></div><p class="totals">累計 ${count}スタンプ</p>`;
    document.getElementById('reward-summary').innerHTML=`<p class="reward-label">利用できる特典</p><p class="reward-count">${data.availableBonus}<small>個</small></p><div class="reward-totals">獲得 <strong>${data.earnedBonus}個</strong><span aria-hidden="true">／</span>使用済み <strong>${data.redeemedBonus}個</strong></div><p class="reward-help muted">特典を受け取る際はスタッフにお声がけください。</p>`;
    let previousMonth='';
    document.getElementById('records').innerHTML=history.length
      ?history.map(r=>{
        const month=formatMonth(r.timestamp);
        const heading=month===previousMonth?'':`<h3 class="month">${escapeHtml(month)}</h3>`;
        previousMonth=month;
        return `${heading}<div class="record"><div><strong>${escapeHtml(r.eventName||'イベント')}</strong><div class="muted">${escapeHtml(formatDate(r.timestamp))}</div></div><span class="tag ${r.revoked||r.stampMode!=='on'?'off':''}">${r.revoked?'訂正済み':r.collection?('集金・'+(r.paymentStatus||'未入金')):r.stampMode==='on'?'+1 スタンプ':'参加のみ'}</span></div>`;
      }).join('')
      :'まだ参加履歴がありません。';
    const redemptions=[...(data.redemptions||[])].sort((a,b)=>new Date(b.redeemedAt)-new Date(a.redeemedAt));
    document.getElementById('redemptions').innerHTML=redemptions.length
      ?redemptions.map(r=>`<div class="record"><div><strong>🎁 特典を使用</strong><div class="muted">${escapeHtml(formatDate(r.redeemedAt))}</div></div><span class="tag off">使用済み</span></div>`).join('')
      :'まだ特典を使用していません。';
}

let loadedOnce=false;
async function loadMyPage(){
  if(refreshButton.disabled&&loadedOnce)return;
  refreshButton.disabled=true;
  refreshStatus.className='shop-status muted';
  refreshStatus.textContent='最新の記録を確認しています...';
  try{
    const accessToken=liff.getAccessToken();
    if(!accessToken)throw Error('LINEから開き直してください。');
    const response=await fetch(API,{method:'POST',body:JSON.stringify({type:'mypageV2',accessToken})});
    if(!response.ok)throw Error('通信エラーが発生しました。');
    const data=await response.json();
    if(!data.ok)throw Error(data.message||'読み込めませんでした。');
    renderMyPage(data);
    loadedOnce=true;
    refreshStatus.textContent='最新の記録に更新しました。';
  }catch(error){
    refreshStatus.className='shop-status error';
    refreshStatus.textContent=error.message||'通信エラーが発生しました。';
    if(!loadedOnce){const summary=document.getElementById('summary');summary.classList.add('error');summary.textContent=refreshStatus.textContent}
  }finally{
    refreshButton.disabled=false;
  }
}
refreshButton.addEventListener('click',loadMyPage);
(async()=>{
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:new URL('mypage.html',location.href).href});return}
    void loadProfileName();
    if(liff.isApiAvailable('scanCodeV2')){
      scanButton.disabled=false;
      scanStatus.textContent='活動会場のQRコードにカメラを向けてください。';
    }else{
      scanStatus.textContent='この環境では読み取れません。LINE Developersの「Scan QR」とLIFF画面サイズ「Full」を確認してください。';
    }
    await loadMyPage();
  }catch(error){
    refreshStatus.className='shop-status error';
    refreshStatus.textContent=error.message||'LINEの初期化に失敗しました。';
    const summary=document.getElementById('summary');summary.classList.add('error');summary.textContent=refreshStatus.textContent;
  }
})();
</script>
