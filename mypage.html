<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>スタンプカード | MatchPoint</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17324c}
    body{margin:0;background:#eef8f7}
    .header{background:#168b77;color:#fff;text-align:center;padding:22px}
    main{max-width:680px;margin:20px auto;padding:0 16px}
    .card{background:#fff;padding:20px;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 18px #17324c12}
    .shop{background:linear-gradient(140deg,#07565b,#13877b 70%,#32a497);color:#fff;position:relative;overflow:hidden;padding:26px;box-shadow:0 12px 28px #07565b35}.shop::after{content:"";position:absolute;width:170px;height:170px;right:-65px;top:-70px;border:2px solid #ffffff35;border-radius:50%;pointer-events:none}.shop .muted{color:#dbf4ec}.shop h2{margin:0 0 18px;font-size:18px}.shop .big{font-size:28px}.shop .stamp{border-color:#e7faf2;color:#f3fff9;background:#ffffff20}.shop .stamp.on{background:#fff;color:#087a71}.shop .stamps{justify-content:flex-start}.shop .bonus{display:inline-block;background:#ffffffec;color:#07565b;padding:9px 14px;border-radius:22px;font-weight:700}.shop p{line-height:1.5}.tools{display:flex;gap:10px;align-items:center;margin:0 0 14px}.refresh-button{width:auto!important;padding:7px 12px!important;font-size:13px!important;white-space:nowrap}.upcoming .notice{margin-top:8px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.upcoming .item{padding:13px 0;border-top:1px solid #e5eeee}.upcoming .pill{background:#e6f5f0;color:#087763;border-radius:20px;padding:4px 9px;font-size:13px}.upcoming .pill.done{background:#edf1f3;color:#536977}
    .stamps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}
    .stamp{width:42px;height:42px;border-radius:50%;border:2px solid #168b77;display:grid;place-items:center;color:#168b77;font-size:24px}
    .stamp.on{background:#168b77;color:#fff}
    .big{font-size:22px;font-weight:700}
    .record{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid #e5eeee}.record strong{overflow-wrap:anywhere}.month{margin:22px 0 8px;color:#168b77}.tag{white-space:nowrap;padding:4px 8px;border-radius:8px;background:#e6f5f0;color:#087763;font-size:13px}.tag.off{background:#edf1f3;color:#536977}
    .muted{color:#577080;font-size:14px}
    .error{color:#b13232}
    .scan-button{width:100%;padding:15px;border:0;border-radius:12px;background:#168b77;color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
    .scan-button:disabled{background:#a8bdbc;cursor:not-allowed}
    #scan-status{min-height:1.4em;margin-bottom:0}
    .refresh-button{width:100%;padding:12px;border:1px solid #168b77;border-radius:12px;background:#fff;color:#087763;font:inherit;font-weight:700;cursor:pointer}
    .refresh-button:disabled{opacity:.55;cursor:not-allowed}
    #refresh-status{min-height:1.4em;margin:8px 0 0}
    .monthly-item{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #e5eeee}

    *{box-sizing:border-box}
    :root{color:#123d45;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
    body{background:radial-gradient(circle at 12% 1%,#e5f5f0 0,#f5fbf9 42%,#eef7f5 100%)}
    .header{background:transparent;color:#07585a;padding:23px 16px 6px}
    .header h1{font-size:clamp(22px,5vw,30px);margin:0;font-weight:800;letter-spacing:.02em}
    main{margin:14px auto;padding:0 14px 24px}
    .card{border-radius:25px;box-shadow:0 12px 32px #055e5411;padding:24px;margin-bottom:18px}
    .shop{min-height:294px;padding:28px 26px;background:radial-gradient(circle at 88% 19%,#19a08d66,transparent 45%),linear-gradient(135deg,#06555b,#087e71 63%,#006b66);border-radius:27px}
    .shop::before{content:"";position:absolute;right:-50px;top:30px;width:260px;height:260px;border:1px solid #ffffff30;border-radius:50%;transform:rotate(-20deg)}
    .shop::after{width:330px;height:330px;top:auto;bottom:-220px;right:auto;left:-120px;background:#26a49a25;border:1px solid #ffffff20}
    .shop h2{font-size:18px;letter-spacing:.13em;margin:0 0 22px;color:#eafff7}
    .shop .balance{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
    .shop .count-label{display:block;font-size:16px;font-weight:700}
    .shop .big{font-size:clamp(52px,14vw,82px);line-height:1.07;letter-spacing:-.04em}
    .shop .big small{font-size:22px;letter-spacing:0}
    .shop .bonus{border-radius:999px;background:linear-gradient(95deg,#fff4be,#ffda76);color:#3c3216;box-shadow:0 5px 18px #033d3d44;font-size:14px}
    .shop .stamps{justify-content:space-between;flex-wrap:nowrap;margin:26px 0 18px;gap:7px}
    .shop .stamp{width:clamp(36px,13vw,66px);height:clamp(36px,13vw,66px);flex:0 1 66px;border:2px dashed #cefff2aa;font-size:clamp(19px,6vw,29px);color:#fff}
    .shop .stamp.on{border:2px solid #fff;background:#fff;box-shadow:0 5px 10px #003f3e77;color:#087b70}
    .shop .progress{margin:0;text-align:center;font-size:17px}
    .shop .totals{text-align:center;margin-bottom:0;font-size:12px}
    .tools{justify-content:flex-end;flex-wrap:wrap;margin:0 0 10px}
    .refresh-button{border-radius:999px!important}
    #refresh-status{margin:0;min-height:0;font-size:12px;flex-basis:100%;text-align:right}
    .card h2{color:#07585a;margin:0 0 18px;font-size:21px}
    .shop h2{color:#eafff7}
    .upcoming .item{background:#f1f8f7;border:0;border-radius:17px;padding:16px;margin-bottom:12px}
    .upcoming .item strong{font-size:17px}
    .upcoming .pill{float:right;background:#e2f5e6;color:#137748;font-weight:700}
    .upcoming .pill.done{background:#e8edef;color:#526c72}
    .upcoming .notice{clear:both;padding-top:8px}
    .scan-button{background:linear-gradient(100deg,#087f76,#078d83);box-shadow:0 6px 16px #087f7644}
    .record{line-height:1.5}
    @media(max-width:390px){.shop{padding:22px 18px}.shop .bonus{font-size:12px}.upcoming .pill{float:none;display:inline-block;margin-left:4px}}
  </style>
</head>
<body>
<header class="header"><h1>MatchPoint スタンプカード</h1></header>
<main>
  <section class="card shop" id="summary" aria-label="ショップカード">読み込み中...</section>
  <section class="card upcoming"><div class="tools"><button type="button" id="refresh-button" class="refresh-button" disabled>↻ 表示を更新</button><span id="refresh-status" class="muted" role="status">読み込み中...</span></div><h2>▦ 参加予定イベント</h2><div id="upcoming">読み込み中...</div>
    <button type="button" id="scan-button" class="scan-button" disabled>▣ QRコードを読み取る</button>
    <p id="scan-status" class="muted" role="status">読み取り機能を確認中...</p>
  </section>
  <section class="card"><h2>◷ スタンプ・参加履歴</h2><div id="records"></div></section>
  <section class="card"><h2>月別の参加回数</h2><p class="muted">スタンプなしの参加、集金の受付、スタンプを訂正した参加も含みます。</p><div id="monthly-counts"></div></section>
  <section class="card"><h2>特典の利用履歴</h2><div id="redemptions"></div></section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbxTYedx5VBpe5BPyIsQx0iNwS_3xZ3EaWfQDDyOGSQhP3TK6J0F-VWRfYvTjaOATawn/exec';
const LIFF_ID='2011752461-qIktF1m8';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scanButton=document.getElementById('scan-button');
const scanStatus=document.getElementById('scan-status');
const refreshButton=document.getElementById('refresh-button');
const refreshStatus=document.getElementById('refresh-status');
const formatDate=v=>new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const formatMonth=v=>new Date(v).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long'});

scanButton.addEventListener('click',async()=>{
  scanButton.disabled=true;
  scanStatus.className='muted';
  scanStatus.textContent='カメラを起動しています...';
  try{
    const result=await liff.scanCodeV2();
    if(!result || !result.value){
      scanStatus.textContent='読み取りがキャンセルされました。';
      return;
    }
    const scanned=new URL(result.value);
    const expected=new URL('stamp/index.html',location.href);
    if(scanned.origin!==expected.origin || scanned.pathname!==expected.pathname ||
       !scanned.searchParams.get('event') || !scanned.searchParams.get('code')){
      throw Error('このサークルの参加用QRコードを読み取ってください。');
    }
    // 既存の取得画面が、QRの期限・イベント・重複取得をサーバーへ照会する。
    location.assign(scanned.href);
  }catch(error){
    scanStatus.className='error';
    scanStatus.textContent=error instanceof TypeError
      ? 'QRコードの内容を読み取れませんでした。'
      : (error.message||'カメラを起動できませんでした。権限設定をご確認ください。');
  }finally{
    scanButton.disabled=false;
  }
});

function renderMyPage(data){
    const summary=document.getElementById('summary');
    summary.classList.remove('error');
    const history=[...(data.records||[])].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    const monthly=new Map();
    history.forEach(r=>{const month=formatMonth(r.timestamp);monthly.set(month,(monthly.get(month)||0)+1)});
    document.getElementById('monthly-counts').innerHTML=monthly.size
      ?[...monthly].map(([month,count])=>`<div class="monthly-item"><span>${escapeHtml(month)}</span><strong>${count}回</strong></div>`).join('')
      :'まだ参加履歴がありません。';
    const count=data.stampCount;
    const rem=count%5;
    const toNext=5-rem;
    summary.innerHTML=`<h2>◈ MatchPoint <span aria-label="ショップカード">SHOP CARD</span></h2><div class="balance"><div><span class="count-label">スタンプ</span><div class="big">${count}<small> 個</small></div></div><span class="bonus">🎁 利用できる特典 ${data.availableBonus}個</span></div><div class="stamps" role="img" aria-label="5個ごとに特典。今回のカードは${rem}個獲得済み">${Array.from({length:5},(_,i)=>`<span class="stamp ${i<rem?'on':''}" aria-hidden="true">${i<rem?'🏸':''}</span>`).join('')}</div><p class="progress">次の特典まであと <strong>${toNext}個</strong></p><p class="muted totals">獲得 ${data.earnedBonus}個 ／ 使用済み ${data.redeemedBonus}個</p>${data.availableBonus>0?'<p class="progress">特典を受け取る際はスタッフにお声がけください。</p>':''}`;
    const upcoming=data.upcoming||[];
    document.getElementById('upcoming').innerHTML=upcoming.length?upcoming.map(e=>{
      const details=[e.startsAt?`日時：${escapeHtml(formatDate(e.startsAt))}`:'',e.location?`場所：${escapeHtml(e.location)}`:'',e.belongings?`持ち物：${escapeHtml(e.belongings)}`:''].filter(Boolean).join('<br>');
      return `<div class="item"><strong>${escapeHtml(e.eventName)}</strong> <span class="pill ${['受付済み','期限切れ'].includes(e.status)?'done':''}">${escapeHtml(e.status)}</span>${details?`<div class="notice muted">${details}</div>`:''}</div>`;
    }).join(''):'参加予定のイベントはありません。';
    let previousMonth='';
    document.getElementById('records').innerHTML=history.length
      ?history.map(r=>{
        const month=formatMonth(r.timestamp);
        const heading=month===previousMonth?'':`<h3 class="month">${escapeHtml(month)}</h3>`;
        previousMonth=month;
        return `${heading}<div class="record"><div><strong>${escapeHtml(r.eventName||'イベント')}</strong><div class="muted">${escapeHtml(formatDate(r.timestamp))}</div></div><span class="tag ${r.revoked||r.stampMode!=='on'?'off':''}">${r.revoked?'訂正済み':r.collection?('集金・'+(r.paymentStatus||'未入金')):r.stampMode==='on'?'+1 スタンプ':'参加のみ'}</span></div>`;
      }).join('')
      :'まだ参加履歴がありません。';
    const redemptions=[...(data.redemptions||[])].sort((a,b)=>new Date(b.redeemedAt)-new Date(a.redeemedAt));
    document.getElementById('redemptions').innerHTML=redemptions.length
      ?redemptions.map(r=>`<div class="record"><div><strong>🎁 特典を使用</strong><div class="muted">${escapeHtml(formatDate(r.redeemedAt))}</div></div><span class="tag off">使用済み</span></div>`).join('')
      :'まだ特典を使用していません。';
}

let loadedOnce=false;
async function loadMyPage(){
  if(refreshButton.disabled&&loadedOnce)return;
  refreshButton.disabled=true;
  refreshStatus.className='muted';
  refreshStatus.textContent='最新の記録を確認しています...';
  try{
    const accessToken=liff.getAccessToken();
    if(!accessToken)throw Error('LINEから開き直してください。');
    const response=await fetch(API,{method:'POST',body:JSON.stringify({type:'mypage',accessToken})});
    if(!response.ok)throw Error('通信エラーが発生しました。');
    const data=await response.json();
    if(!data.ok)throw Error(data.message||'読み込めませんでした。');
    renderMyPage(data);
    loadedOnce=true;
    refreshStatus.textContent='最新の記録に更新しました。';
  }catch(error){
    refreshStatus.className='error';
    refreshStatus.textContent=error.message||'通信エラーが発生しました。';
    if(!loadedOnce){const summary=document.getElementById('summary');summary.classList.add('error');summary.textContent=refreshStatus.textContent}
  }finally{
    refreshButton.disabled=false;
  }
}
refreshButton.addEventListener('click',loadMyPage);
(async()=>{
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:new URL('mypage.html',location.href).href});return}
    if(liff.isApiAvailable('scanCodeV2')){
      scanButton.disabled=false;
      scanStatus.textContent='活動会場のQRコードにカメラを向けてください。';
    }else{
      scanStatus.textContent='この環境では読み取れません。LINE Developersの「Scan QR」とLIFF画面サイズ「Full」を確認してください。';
    }
    await loadMyPage();
  }catch(error){
    refreshStatus.className='error';
    refreshStatus.textContent=error.message||'LINEの初期化に失敗しました。';
    const summary=document.getElementById('summary');summary.classList.add('error');summary.textContent=refreshStatus.textContent;
  }
})();
</script>
</body>
</html>
